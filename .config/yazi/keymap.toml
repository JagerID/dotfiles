[mgr]
keymap	= [
	# ================================= ПЕРЕМЕЩЕНИЕ =================================
	{ on = "h",		run = "leave",				desc = "Go to parent directory"		},
	{ on = "j",		run = "arrow next",			desc = "Move cursor down"		},
	{ on = "k",		run = "arrow prev",			desc = "Move cursor up"			},
	{ on = "l",		run = "enter",				desc = "Enter dir or open file"		},

	{ on = "<Left>",	run = "leave",				desc = "Go to parent directory"		},
	{ on = "<Down>",	run = "arrow next",			desc = "Move cursor up"			},
	{ on = "<Up>",		run = "arrow prev",			desc = "Move cursor down"		},
	{ on = "<Right>",	run = "enter",				desc = "Enter dir or open file"		},

	{ on = [ "g", "g" ],	run = "arrow top",			desc = "Go to top"			},

	# =================================== ТЕРМИНАЛ ====================================

	{ on = "<C-t>",		run = "shell /bin/zsh --block",		desc = "Open terminal here"		},

	# =============================== ВИЗУАЛЬНЫЙ РЕЖИМ ================================
	{ on = "v",		run = "visual_mode",			desc = "Open visual mode"		},
	{ on = "V",		run = "visual_mode --unset",		desc = "Disable visual mode"		},
	{ on = "<C-a>",		run = "toggle_all",			desc = "Select all files"		},

	# ===================================== ПОИСК =====================================
	{ on = "/",		run = "find",				desc = "Find (next)"			},
	{ on = "?",		run = "find --previous",		desc = "Find (previous)"		},
	{ on = "n",		run = "find_arrow",			desc = "Go to next"			},
	{ on = "N",		run = "find_arrow --previous",		desc = "Go to prev"			},
	{ on = "f",		run = "filter",				desc = "Filter"				},
	
	# === ripgred / fd
	{ on = "s",		run = "search --via=fd",		desc = "Search files (fd)"		},
	{ on = "S",		run = "search --via=rg",		desc = "Search text (rg)"		},

	# ========================== РАБОТА С ФАЙЛАМИ / ПАПКАМИ ===========================

	# === Создание
	{ on = "c",		run = "create",				desc = "Create new file or folder"	},

	# === Переименование
	{ on = "r",		run = "rename --cursor=before_ext",	desc = "Rename file"			},
	{ on = "<F2>",		run = "rename --cursor=before_ext",	desc = "Rename file"			},
	
	# === Удаление
	{ on = "d",		run = "remove",				desc = "Move to trash"			},
	{ on = "<S-d>",		run = "remove --permanently",		desc = "Remove permanently"		},
	{ on = "<Delete>",	run = "remove",				desc = "Move to trash"			},
	{ on = "<S-Delete>",	run = "remove --permanently",		desc = "Remove permanently"		},

	# === Ctrl-x, Ctrl-c, Ctrl-v, копирование метаданных
	{ on = "y",		run = "yank",				desc = "Copy selected files"		},
	{ on = "<C-c>",		run = "yank",				desc = "Copy selected files"		},
	{ on = "x",		run = "yank --cut",			desc = "Cut selected files"		},
	{ on = "<C-x>",		run = "yank --cut",			desc = "Cut selected files"		},
	{ on = "p",		run = "paste",				desc = "Paste files from buf"		},
	{ on = "<C-v>",		run = "paste",				desc = "Paste files from buf"		},

	{ on = "<C-A-p>",	run = "copy path",			desc = "Copy path"			},
	{ on = "<C-A-n>",	run = "copy filename",			desc = "Copy filename"			},

	# === Ctrl-z, Ctrl-Shift-z

	{ on = "<C-z>",		run = "undo",				desc = "Undo"				},
	{ on = "<C-S-z>",	run = "redo",				desc = "Redo"				},

	# === Открытие
	{ on = "<Enter>",	run = "open",				desc = "Open selected files"		},
	{ on = "<S-Enter>",	run = "open --interactive",		desc = "Open interactively"		},

	# ==================================== LINEMODE ===================================
	{ on = [ "m", "s" ],	run = "linemode size",			desc = "Linemode: size"			},
	{ on = [ "m", "p" ],	run = "linemode permissions",		desc = "Linemode: permissions"		},
	{ on = [ "m", "b" ],	run = "linemode btime",			desc = "Linemode: btime"		},
	{ on = [ "m", "m" ],	run = "linemode mtime",			desc = "Linemode: mtime"		},
	{ on = [ "m", "o" ],	run = "linemode owner",			desc = "Linemode: owner"		},
	{ on = [ "m", "n" ],	run = "linemode none",			desc = "Linemode: none"			},

	# ====================================== GOTO =====================================
	{ on = [ "g", "h" ],	run = "cd ~",				desc = "Go home"			},
	{ on = [ "g", "c" ],	run = "cd ~/.config",			desc = "Go config"			},
	{ on = [ "g", "D" ],	run = "cd ~/Downloads",			desc = "Go downloads"			},
	{ on = [ "g", "d" ],	run = "cd ~/dotfiles",			desc = "Go dotfiles"			},

	# ================================= ОБЩИЕ КОМАНДЫ =================================
	{ on = "<Enter>",	run = "enter",				desc = "Open file or enter dir"		},
	{ on = "<Esc>",		run = "escape",				desc = "Reset selection / exit from v"	},
	{ on = "<F5>",		run = "reload",				desc = "Reload file list (force)"	},
	{ on = ".",		run = "hidden toggle",			desc = "Toggle .files"			},
	{ on = "q",		run = "quit",				desc = "Quit"				},
]
